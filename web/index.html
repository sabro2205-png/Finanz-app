/* =================================================================== Charts */
const VBW = 360;

/** Balken mit abgerundetem Datenende, an der Grundlinie verankert. */
function barPath(x, yTop, w, h, r) {
  if (h <= 0.2) return "";
  const rr = Math.min(r, w / 2, h);
  return `M${x} ${yTop + h} L${x} ${yTop + rr} Q${x} ${yTop} ${x + rr} ${yTop} L${x + w - rr} ${yTop} Q${x + w} ${yTop} ${x + w} ${yTop + rr} L${x + w} ${yTop + h} Z`;
}
function barPathDown(x, yTop, w, h, r) {
  if (h <= 0.2) return "";
  const rr = Math.min(r, w / 2, h);
  return `M${x} ${yTop} L${x} ${yTop + h - rr} Q${x} ${yTop + h} ${x + rr} ${yTop + h} L${x + w - rr} ${yTop + h} Q${x + w} ${yTop + h} ${x + w} ${yTop + h - rr} L${x + w} ${yTop} Z`;
}

function mountTooltip(wrap) {
  const tip = document.createElement("div");
  tip.className = "tip";
  wrap.appendChild(tip);
  return tip;
}

function wireHits(wrap, svg, tip, slots, build) {
  const hide = () => { tip.style.opacity = "0"; svg.querySelectorAll("[data-bg]").forEach(r => r.setAttribute("opacity", "0")); };
  slots.forEach((slot, i) => {
    const hit = svg.querySelector(`[data-hit="${i}"]`);
    if (!hit) return;
    const show = () => {
      const scale = wrap.clientWidth / VBW;
      tip.innerHTML = build(i);
      tip.style.left = Math.max(58, Math.min(wrap.clientWidth - 58, slot.cx * scale)) + "px";
      // Standardmässig über dem Datenpunkt; passt er dort nicht, klappt er darunter.
      tip.style.opacity = "0";
      tip.style.transform = "translate(-50%,-100%)";
      tip.style.top = "0px";
      const h = tip.offsetHeight;
      const above = slot.top * scale - 8;
      if (above - h < 0) {
        tip.style.transform = "translate(-50%,0)";
        tip.style.top = (slot.top * scale + 14) + "px";
      } else {
        tip.style.top = above + "px";
      }
      tip.style.opacity = "1";
      svg.querySelectorAll("[data-bg]").forEach(r => r.setAttribute("opacity", "0"));
      const bg = svg.querySelector(`[data-bg="${i}"]`);
      if (bg) bg.setAttribute("opacity", "0.05");
    };
    hit.addEventListener("pointerenter", show);
    hit.addEventListener("pointermove", show);
    hit.addEventListener("focus", show);
    hit.addEventListener("blur", hide);
  });
  wrap.addEventListener("pointerleave", hide);
}

function drawYearChart(wrap, y) {
  if (!wrap) return;
  const H = 168, padT = 20, padB = 20;
  const base = H - padB;
  const plot = base - padT;
  const max = Math.max(1, ...y.months.map(m => Math.max(m.incomeCents, m.expenseCents)));
  const slotW = VBW / 12;
  const barW = Math.min(slotW * 0.30, 9);
  const gap = 2;

  let marks = "", labels = "", hits = "";
  const slots = [];

  for (let i = 0; i < 12; i++) {
    const cx = slotW * i + slotW / 2;
    const m = y.months[i];
    const hi = m.incomeCents / max * plot;
    const he = m.expenseCents / max * plot;
    marks += `<path d="${barPath(cx - barW - gap / 2, base - hi, barW, hi, 2.5)}" fill="var(--in)"/>`;
    marks += `<path d="${barPath(cx + gap / 2, base - he, barW, he, 2.5)}" fill="var(--out)"/>`;
    if (i % 2 === 0) labels += `<text x="${cx}" y="${base + 13}" text-anchor="middle" font-size="9.5" fill="var(--ink-3)">${MONTHS_SHORT[i]}</text>`;
    hits += `<rect data-bg="${i}" x="${slotW * i + 1}" y="${padT - 6}" width="${slotW - 2}" height="${plot + 10}" rx="4" fill="var(--ink)" opacity="0"/>`;
    hits += `<rect data-hit="${i}" x="${slotW * i}" y="0" width="${slotW}" height="${H}" fill="transparent" tabindex="0" role="button" aria-label="${MONTHS[i]}: Einnahmen ${fmt(m.incomeCents)}, Ausgaben ${fmt(m.expenseCents)}"/>`;
    slots.push({ cx, top: Math.min(base - hi, base - he) });
  }

  wrap.innerHTML = `<svg viewBox="0 0 ${VBW} ${H}" role="img" aria-label="Balkendiagramm: Einnahmen und Ausgaben je Monat in ${y.year}. Die Werte stehen in der Tabelle darunter.">
    <text x="0" y="10" font-size="9.5" fill="var(--ink-3)" class="num">${fmtCompact(max)} €</text>
    <line x1="0" y1="${padT}" x2="${VBW}" y2="${padT}" stroke="var(--grid)" stroke-width="1"/>
    <line x1="0" y1="${base}" x2="${VBW}" y2="${base}" stroke="var(--axis)" stroke-width="1"/>
    ${marks}${labels}${hits}
  </svg>`;

  const svg = wrap.querySelector("svg");
  const tip = mountTooltip(wrap);
  wireHits(wrap, svg, tip, slots, i => {
    const m = y.months[i];
    return `<b>${MONTHS[i]} ${y.year}</b>
      <div class="r"><span class="k"><i class="dot" style="background:var(--in)"></i>Einnahmen</span><span class="v num">${fmt(m.incomeCents)}</span></div>
      <div class="r"><span class="k"><i class="dot" style="background:var(--out)"></i>Ausgaben</span><span class="v num">${fmt(m.expenseCents)}</span></div>
      <div class="r"><span class="k">Rest</span><span class="v num">${fmt(m.balanceCents)}</span></div>`;
  });
}

function drawSavingsChart(wrap, s) {
  if (!wrap) return;

  /* Sparrate (Hunderter) und Gesamtstand (Tausender) haben sehr verschiedene
     Grössenordnungen. Zwei Achsen in einem Feld wären irreführend, deshalb
     zwei übereinanderliegende Felder mit gemeinsamer Monatsachse. */
  const padL = 42, padT = 28, labelsH = 18, gapH = 34;
  const p1H = 66, p2H = 62;
  const p1Top = padT, p2Top = padT + p1H + gapH;
  const H = p2Top + p2H + labelsH;
  const plotW = VBW - padL;
  const slotW = plotW / 12;
  const barW = Math.min(slotW * 0.46, 14);

  // Feld 1 – Sparrate je Monat
  const nets = s.months.map(m => m.netCents);
  const nMax = Math.max(0, ...nets), nMin = Math.min(0, ...nets);
  const nSpan = Math.max(1, nMax - nMin);
  const y1 = v => p1Top + p1H - ((v - nMin) / nSpan) * p1H;
  const zero1 = y1(0);

  // Feld 2 – kumulierter Gesamtstand, inklusive der prognostizierten Fortsetzung
  const fpts = s.forecast.points;
  const bals = fpts.map(q => q.balanceCents);
  const bMax = Math.max(0, ...bals), bMin = Math.min(0, ...bals);
  const bSpan = Math.max(1, bMax - bMin);
  const y2 = v => p2Top + p2H - ((v - bMin) / bSpan) * p2H;

  let bars = "", labels = "", hits = "";
  const slots = [];
  for (let i = 0; i < 12; i++) {
    const cx = padL + slotW * i + slotW / 2;
    const v = s.months[i].netCents;
    const vy = y1(v);
    if (v > 0) bars += `<path d="${barPath(cx - barW / 2, vy, barW, zero1 - vy, 3)}" fill="var(--save)"/>`;
    else if (v < 0) bars += `<path d="${barPathDown(cx - barW / 2, zero1, barW, vy - zero1, 3)}" fill="var(--out)"/>`;
    if (i % 2 === 0) labels += `<text x="${cx}" y="${H - 5}" text-anchor="middle" font-size="9.5" fill="var(--ink-3)">${MONTHS_SHORT[i]}</text>`;
    hits += `<rect data-bg="${i}" x="${padL + slotW * i + 1}" y="${p1Top - 8}" width="${slotW - 2}" height="${p2Top + p2H - p1Top + 14}" rx="4" fill="var(--ink)" opacity="0"/>`;
    hits += `<rect data-hit="${i}" x="${padL + slotW * i}" y="0" width="${slotW}" height="${H}" fill="transparent" tabindex="0" role="button" aria-label="${MONTHS[i]}: Sparrate ${fmt(v)}, Gesamtstand ${fmt(s.months[i].runningBalanceCents)}"/>`;
    slots.push({ cx, top: Math.min(vy, zero1) });
  }

  const pts = fpts.map((q, i) => [padL + slotW * i + slotW / 2, y2(q.balanceCents)]);
  const lastActual = fpts.reduce((acc, q, i) => q.forecast ? acc : i, 0);
  const actualPts = pts.slice(0, lastActual + 1);
  // Die Prognoselinie beginnt am letzten Ist-Punkt, damit keine Lücke entsteht.
  const forecastPts = fpts.some(q => q.forecast) ? pts.slice(lastActual) : [];

  const area = actualPts.length > 1
    ? `<path d="M${actualPts[0][0]} ${y2(bMin)} ${actualPts.map(q => "L" + q[0] + " " + q[1]).join(" ")} L${actualPts[actualPts.length - 1][0]} ${y2(bMin)} Z" fill="var(--save)" opacity="0.12"/>`
    : "";
  const line = actualPts.length > 1
    ? `<polyline points="${actualPts.map(q => q.join(",")).join(" ")}" fill="none" stroke="var(--save)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`
    : "";
  const fline = forecastPts.length > 1
    ? `<polyline points="${forecastPts.map(q => q.join(",")).join(" ")}" fill="none" stroke="var(--save)" stroke-width="2" stroke-dasharray="4 3" stroke-linejoin="round" stroke-linecap="round"/>`
    : "";
  const dots = pts.map((q, i) => fpts[i].forecast
    ? `<circle cx="${q[0]}" cy="${q[1]}" r="2.6" fill="var(--chart-surface)" stroke="var(--save)" stroke-width="1.6"/>`
    : `<circle cx="${q[0]}" cy="${q[1]}" r="3" fill="var(--save)" stroke="var(--chart-surface)" stroke-width="2"/>`).join("");

  wrap.innerHTML = `<svg viewBox="0 0 ${VBW} ${H}" role="img" aria-label="Zwei Diagramme für ${s.year}: oben die Sparrate je Monat, darunter der kumulierte Gesamtstand mit gestrichelter Prognose für noch offene Monate. Alle Werte stehen in der Liste darunter.">
    <text x="0" y="${p1Top - 13}" font-size="9" fill="var(--ink-3)" font-weight="600" letter-spacing="0.5">SPARRATE</text>
    <text x="0" y="${y1(nMax) + 3}" font-size="9.5" fill="var(--ink-3)" class="num">${fmtCompact(nMax)}</text>
    ${nMin < 0 ? `<text x="0" y="${y1(nMin) + 3}" font-size="9.5" fill="var(--ink-3)" class="num">${fmtCompact(nMin)}</text>` : ""}
    <line x1="${padL}" y1="${zero1}" x2="${VBW}" y2="${zero1}" stroke="var(--axis)" stroke-width="1"/>
    ${bars}

    <text x="0" y="${p2Top - 13}" font-size="9" fill="var(--ink-3)" font-weight="600" letter-spacing="0.5">GESAMTSTAND</text>
    <text x="0" y="${y2(bMax) + 3}" font-size="9.5" fill="var(--ink-3)" class="num">${fmtCompact(bMax)}</text>
    <line x1="${padL}" y1="${y2(bMax)}" x2="${VBW}" y2="${y2(bMax)}" stroke="var(--grid)" stroke-width="1"/>
    <line x1="${padL}" y1="${y2(bMin)}" x2="${VBW}" y2="${y2(bMin)}" stroke="var(--axis)" stroke-width="1"/>
    ${area}${line}${fline}${dots}

    ${labels}${hits}
  </svg>`;

  const svg = wrap.querySelector("svg");
  const tip = mountTooltip(wrap);
  wireHits(wrap, svg, tip, slots, i => {
    const m = s.months[i];
    return `<b>${MONTHS[i]} ${s.year}</b>
      <div class="r"><span class="k"><i class="dot" style="background:${m.netCents < 0 ? "var(--out)" : "var(--save)"}"></i>${m.netCents < 0 ? "Entnahme" : "Sparrate"}</span><span class="v num">${fpts[i].forecast ? "noch offen" : (m.netCents === 0 ? "–" : fmtSigned(m.netCents))}</span></div>
      <div class="r"><span class="k"><i class="line${fpts[i].forecast ? " dashed" : ""}" style="border-color:var(--save)"></i>${fpts[i].forecast ? "Prognose" : "Gesamtstand"}</span><span class="v num">${fpts[i].forecast ? "≈ " : ""}${fmt(fpts[i].balanceCents)}</span></div>`;
  });
}

/* ================================================================== Dialoge */
const dlg = document.getElementById("dlg");
const sheet = document.getElementById("sheet");
let onSubmit = null;

function closeSheet() { onSubmit = null; if (dlg.open) dlg.close(); }

sheet.addEventListener("submit", ev => {
  ev.preventDefault();
  if (onSubmit) onSubmit();
});
dlg.addEventListener("click", ev => { if (ev.target === dlg) closeSheet(); });

/* ------------------------------------------------- Einnahme / Ausgabe */
function entrySheet(existing, initialType) {
  sheet.innerHTML = "";
  const period = state.period;
  let type = existing ? existing.type : (initialType || "expense");
  let category = existing && existing.category ? existing.category : "OTHER";
  let recurring = existing ? existing.recurring : false;
  let startPeriod = existing ? existing.startPeriod : period;
  let endPeriod = existing ? existing.endPeriod : period;   // bei einmalig immer == startPeriod
  let picking = null;          // "start" | "end" | null
  let pickYear = yearOf(startPeriod);
  let showErr = false;

  const placeholder = () => {
    if (type === "income") return "z. B. Gehalt";
    return { RENT:"z. B. Warmmiete", FINANCING:"z. B. Autokredit", SUBSCRIPTION:"z. B. Netflix", OTHER:"z. B. Lebensmittel" }[category];
  };

  function rangeInfo(cents) {
    if (!recurring) return "";
    if (endPeriod === null) return "Läuft ab " + periodLabel(startPeriod) + " unbefristet weiter.";
    const months = endPeriod - startPeriod + 1;
    const total = cents !== null && cents > 0 ? " · Gesamt " + fmt(cents * months) : "";
    return "Laufzeit " + months + " " + (months === 1 ? "Monat" : "Monate") + total + ".";
  }

  function pickerHTML() {
    if (picking === null) return "";
    const target = picking === "start" ? startPeriod : endPeriod;
    return `<div class="picker">
      <div class="switcher compact">
        <button class="navbtn" type="button" data-pickyear="-1" aria-label="Jahr zurück">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <span class="y">${pickYear}</span>
        <button class="navbtn" type="button" data-pickyear="1" aria-label="Jahr weiter">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
      <div class="chips months" role="group" aria-label="Monat wählen">
        ${MONTHS_SHORT.map((mn, i) => {
          const cand = periodOf(pickYear, i + 1);
          const disabled = picking === "end" && cand < startPeriod;
          return `<button type="button" data-setmonth="${i + 1}" ${disabled ? "disabled" : ""}
                    aria-pressed="${target !== null && cand === target}">${mn}</button>`;
        }).join("")}
      </div>
      ${picking === "end" ? `<button type="button" class="subtle" data-setopen>Kein Ende – läuft unbefristet</button>` : ""}
    </div>`;
  }

  function paint() {
    const title = sheet.querySelector("#f-title") ? sheet.querySelector("#f-title").value : (existing ? existing.title : "");
    const amount = sheet.querySelector("#f-amount") ? sheet.querySelector("#f-amount").value : (existing ? fmtInput(existing.amountCents) : "");
    const cents = parseAmount(amount);
    const okTitle = title.trim().length > 0;
    const okAmount = cents !== null && cents > 0;

    openSheetKeepFocus(`
      <h2>${existing ? "Posten bearbeiten" : "Neuer Posten"}</h2>
      <div class="when">${esc(recurring ? "Wiederkehrender Posten" : periodLabel(startPeriod))}</div>

      <div class="field">
        <div class="seg" role="group" aria-label="Art des Postens">
          <button type="button" data-type="income"  aria-pressed="${type === "income"}">Einnahme</button>
          <button type="button" data-type="expense" aria-pressed="${type === "expense"}">Ausgabe</button>
        </div>
      </div>

      ${type === "expense" ? `<div class="field">
        <label id="lbl-cat">Kategorie</label>
        <div class="chips" role="group" aria-labelledby="lbl-cat">
          ${CATEGORIES.map(c => `<button type="button" data-cat="${c.id}" aria-pressed="${category === c.id}">${esc(c.label)}</button>`).join("")}
        </div>
      </div>` : ""}

      <div class="field">
        <label for="f-title">Bezeichnung</label>
        <input type="text" id="f-title" value="${esc(title)}" placeholder="${esc(placeholder())}" autocomplete="off"
               aria-invalid="${showErr && !okTitle}">
      </div>

      <div class="field">
        <label for="f-amount">Betrag in Euro</label>
        <input type="text" id="f-amount" class="num" inputmode="decimal" value="${esc(amount)}" placeholder="49,99" autocomplete="off"
               aria-invalid="${showErr && !okAmount}">
      </div>

      <div class="toggle">
        <div class="t">
          <b>Monatlich wiederkehrend</b>
          <span>${recurring ? "Läuft über mehrere Monate" : "Gilt nur in einem einzelnen Monat"}</span>
        </div>
        <button type="button" data-recurring role="switch" aria-checked="${recurring}" aria-pressed="${recurring}" aria-label="Monatlich wiederkehrend"></button>
      </div>

      <div class="field" style="margin-top:12px">
        <label>${recurring ? "Zeitraum" : "Monat"}</label>
        <div class="range">
          <button type="button" data-pick="start" aria-pressed="${picking === "start"}">
            <span>${recurring ? "von" : "im Monat"}</span><b>${esc(periodLabel(startPeriod))}</b>
          </button>
          ${recurring ? `<span class="dash" aria-hidden="true">–</span>
          <button type="button" data-pick="end" aria-pressed="${picking === "end"}">
            <span>bis</span><b>${endPeriod === null ? "unbefristet" : esc(periodLabel(endPeriod))}</b>
          </button>` : ""}
        </div>
        ${pickerHTML()}
        ${recurring ? `<p class="rangenote">${esc(rangeInfo(cents))}</p>` : ""}
      </div>

      ${showErr && !(okTitle && okAmount) ? `<p class="err">Bitte eine Bezeichnung und einen Betrag größer als 0 eingeben.</p>` : ""}

      ${existing ? `<div class="destructive">
        ${existing.recurring ? `<button type="button" class="subtle" data-stop>Ab ${esc(monthName(period))} beenden – frühere Monate bleiben</button>` : ""}
        <button type="button" class="danger" data-del>${existing.recurring ? "Komplett löschen (alle Monate)" : "Löschen"}</button>
      </div>` : ""}

      <div class="actions">
        <button type="button" class="btn" data-cancel>Abbrechen</button>
        <span class="spacer"></span>
        <button type="submit" class="btn primary">Speichern</button>
      </div>
    `, commit);
  }

  function commit() {
    const title = sheet.querySelector("#f-title").value.trim();
    const cents = parseAmount(sheet.querySelector("#f-amount").value);
    if (!title || cents === null || cents <= 0) { showErr = true; paint(); return; }

    const end = recurring ? endPeriod : startPeriod;
    const data = {
      type, category: type === "expense" ? category : null,
      title, amountCents: cents, startPeriod, endPeriod: end, recurring
    };

    if (!existing) { state.entries.push(Object.assign({ id: nextId() }, data)); announce("Posten gespeichert."); }
    else { Object.assign(existing, data); announce("Posten aktualisiert."); }

    // Der Posten kann jetzt ausserhalb des angezeigten Monats liegen – dorthin springen.
    if (!isActiveIn(data, state.period)) state.period = startPeriod;

    state.demo = false;
    persistAndRender();
    closeSheet();
  }

  sheetDelegate = ev => {
    const t = ev.target.closest("button");
    if (!t) return;
    if (t.dataset.type) { type = t.dataset.type; paint(); }
    else if (t.dataset.cat) { category = t.dataset.cat; paint(); }
    else if (t.hasAttribute("data-recurring")) {
      recurring = !recurring;
      // Beim Einschalten offen lassen, beim Ausschalten auf den Startmonat zurück.
      endPeriod = recurring ? null : startPeriod;
      picking = null;
      paint();
    }
    else if (t.dataset.pick) {
      picking = picking === t.dataset.pick ? null : t.dataset.pick;
      if (picking) pickYear = yearOf(picking === "start" ? startPeriod : (endPeriod ?? startPeriod));
      paint();
    }
    else if (t.dataset.pickyear) { pickYear += Number(t.dataset.pickyear); paint(); }
    else if (t.dataset.setmonth) {
      const chosen = periodOf(pickYear, Number(t.dataset.setmonth));
      if (picking === "start") {
        startPeriod = chosen;
        if (!recurring) endPeriod = chosen;
        else if (endPeriod !== null && endPeriod < startPeriod) endPeriod = startPeriod;
      } else {
        endPeriod = chosen;
      }
      picking = null;
      paint();
    }
    else if (t.hasAttribute("data-setopen")) { endPeriod = null; picking = null; paint(); }
    else if (t.hasAttribute("data-cancel")) closeSheet();
    else if (t.hasAttribute("data-del")) {
      state.entries = state.entries.filter(e => e.id !== existing.id);
      state.demo = false; persistAndRender(); closeSheet(); announce("Posten gelöscht.");
    }
    else if (t.hasAttribute("data-stop")) {
      const newEnd = period - 1;
      if (newEnd < existing.startPeriod) state.entries = state.entries.filter(e => e.id !== existing.id);
      else { existing.endPeriod = newEnd; existing.recurring = true; }
      state.demo = false; persistAndRender(); closeSheet(); announce("Posten beendet.");
    }
  };

  paint();
}

/* ---------------------------------------------------------- Sparbetrag */
function savingsSheet(period, existing, keep) {
  sheet.innerHTML = "";
  if (!state.pots.length) {
    state.pots.push({ id: nextId(), name: "Erspartes", color: 0, targetCents: null });
    save();
  }
  let potId = (keep && keep.potId) ? keep.potId
            : existing ? existing.potId
            : (state.potFilter !== null ? state.potFilter : state.pots[0].id);
  let showErr = false;

  function paint() {
    const title = sheet.querySelector("#f-title") ? sheet.querySelector("#f-title").value
                : (keep ? keep.title : existing ? existing.title : "") || "";
    const amount = sheet.querySelector("#f-amount") ? sheet.querySelector("#f-amount").value
                 : (keep ? keep.amount : existing ? fmtInput(existing.amountCents) : "") || "";
    const cents = parseAmount(amount);
    const ok = cents !== null && cents !== 0 && potOf(potId);

    openSheetKeepFocus(`
      <h2>${existing ? "Buchung bearbeiten" : "Geld einzahlen"}</h2>
      <div class="when">${esc(periodLabel(period))}</div>

      <div class="field">
        <label id="lbl-pot">Topf</label>
        <div class="chips" role="group" aria-labelledby="lbl-pot">
          ${state.pots.map(pot => `
            <button type="button" data-pot="${pot.id}" aria-pressed="${potId === pot.id}">
              <i class="dot" style="background:${potColor(pot)}"></i>${esc(pot.name)}
            </button>`).join("")}
          <button type="button" class="ghost" data-pot-new>+ Neuer Topf</button>
        </div>
      </div>

      <div class="field">
        <label for="f-amount">Betrag in Euro</label>
        <input type="text" id="f-amount" class="num" inputmode="decimal" value="${esc(amount)}" placeholder="250 – für eine Entnahme -250" autocomplete="off"
               aria-invalid="${showErr && (cents === null || cents === 0)}">
      </div>

      <div class="field">
        <label for="f-title">Notiz <span style="text-transform:none;letter-spacing:0;font-weight:400">(freiwillig)</span></label>
        <input type="text" id="f-title" value="${esc(title)}" placeholder="z. B. Sonderzahlung" autocomplete="off">
      </div>

      <p class="hint" style="margin:0 0 4px">Negative Beträge gelten als Entnahme aus dem Topf. Erspartes wird
      nicht mit Einnahmen oder Ausgaben verrechnet.</p>

      ${showErr && !ok ? `<p class="err">Bitte einen Topf wählen und einen Betrag ungleich 0 eingeben.</p>` : ""}

      ${existing ? `<div class="destructive"><button type="button" class="danger" data-del>Buchung löschen</button></div>` : ""}

      <div class="actions">
        <button type="button" class="btn" data-cancel>Abbrechen</button>
        <span class="spacer"></span>
        <button type="submit" class="btn primary">Speichern</button>
      </div>
    `, commit);
  }

  function commit() {
    const title = sheet.querySelector("#f-title").value.trim();
    const cents = parseAmount(sheet.querySelector("#f-amount").value);
    if (cents === null || cents === 0 || !potOf(potId)) { showErr = true; paint(); return; }
    if (existing) { Object.assign(existing, { potId, title, amountCents: cents }); announce("Buchung aktualisiert."); }
    else { state.savings.push({ id: nextId(), potId, period, title, amountCents: cents }); announce("Buchung gespeichert."); }
    state.demo = false;
    persistAndRender();
    closeSheet();
  }

  sheetDelegate = ev => {
    const t = ev.target.closest("button");
    if (!t) return;
    if (t.dataset.pot) { potId = Number(t.dataset.pot); paint(); }
    else if (t.hasAttribute("data-pot-new")) {
      // Betrag und Notiz merken, damit der Umweg über den Topf nichts kostet.
      const held = {
        amount: sheet.querySelector("#f-amount").value,
        title: sheet.querySelector("#f-title").value
      };
      potSheet(null, created => savingsSheet(period, existing, Object.assign({}, held, { potId: created.id })));
    }
    else if (t.hasAttribute("data-cancel")) closeSheet();
    else if (t.hasAttribute("data-del")) {
      state.savings = state.savings.filter(e => e.id !== existing.id);
      state.demo = false; persistAndRender(); closeSheet(); announce("Buchung gelöscht.");
    }
  };

  paint();
}

/* ------------------------------------------------------------ Spartöpfe */
/**
 * Anlegen und Ändern eines Topfes. [onCreated] wird nur beim Anlegen
 * aufgerufen, damit der Aufrufer zu seiner Eingabe zurückkehren kann.
 */
function potSheet(existing, onCreated) {
  sheet.innerHTML = "";
  let color = existing ? existing.color : state.pots.length % POT_COLORS;
  let hasTarget = !!(existing && existing.targetCents);
  let moveTo = null;
  let showErr = false;

  const bookings = existing ? state.savings.filter(e => e.potId === existing.id) : [];
  const others = existing ? state.pots.filter(p => p.id !== existing.id) : [];

  function paint() {
    const name = sheet.querySelector("#f-name") ? sheet.querySelector("#f-name").value : (existing ? existing.name : "");
    const target = sheet.querySelector("#f-target")
      ? sheet.querySelector("#f-target").value
      : (existing && existing.targetCents ? fmtInput(existing.targetCents) : "");

    openSheetKeepFocus(`
      <h2>${existing ? "Topf bearbeiten" : "Neuer Topf"}</h2>
      <div class="when">${existing
        ? `Enthält <span class="num">${fmt(potBalance(existing.id))}</span> aus ${bookings.length} ${bookings.length === 1 ? "Buchung" : "Buchungen"}`
        : "Zum Beispiel Notgroschen, Urlaubskasse oder Neues Auto"}</div>

      <div class="field">
        <label for="f-name">Name</label>
        <input type="text" id="f-name" value="${esc(name)}" placeholder="z. B. Notgroschen" autocomplete="off"
               aria-invalid="${showErr && !name.trim()}">
      </div>

      <div class="field">
        <label id="lbl-color">Farbe</label>
        <div class="chips colors" role="group" aria-labelledby="lbl-color">
          ${Array.from({ length: POT_COLORS }, (_, i) => `
            <button type="button" data-color="${i}" aria-pressed="${color === i}" aria-label="Farbe ${i + 1}">
              <i class="swatch" style="background:var(--pot-${i})"></i>
            </button>`).join("")}
        </div>
      </div>

      <div class="toggle">
        <div class="t">
          <b>Sparziel</b>
          <span>${hasTarget ? "Zeigt den Fortschritt zum Ziel" : "Ohne Ziel – der Topf sammelt einfach"}</span>
        </div>
        <button type="button" data-target-toggle role="switch" aria-checked="${hasTarget}" aria-pressed="${hasTarget}" aria-label="Sparziel"></button>
      </div>

      ${hasTarget ? `<div class="field" style="margin-top:10px">
        <label for="f-target">Zielbetrag in Euro</label>
        <input type="text" id="f-target" class="num" inputmode="decimal" value="${esc(target)}" placeholder="3.000" autocomplete="off"
               aria-invalid="${showErr && hasTarget && !(parseAmount(target) > 0)}">
      </div>` : ""}

      ${showErr ? `<p class="err">Bitte einen Namen angeben${hasTarget ? " und ein Ziel größer als 0" : ""}.</p>` : ""}

      ${existing && state.pots.length > 1 ? `<div class="destructive">
        ${bookings.length ? `
          <p class="hint" style="margin:0 0 6px">Beim Löschen ${bookings.length === 1 ? "die Buchung" : "die " + bookings.length + " Buchungen"} verschieben nach:</p>
          <div class="chips" style="margin-bottom:8px">
            ${others.map(p => `<button type="button" data-move="${p.id}" aria-pressed="${moveTo === p.id}">
              <i class="dot" style="background:${potColor(p)}"></i>${esc(p.name)}</button>`).join("")}
            <button type="button" data-move="0" aria-pressed="${moveTo === 0}">Mit löschen</button>
          </div>` : ""}
        <button type="button" class="danger" data-del>Topf löschen</button>
      </div>` : ""}
      ${existing && state.pots.length === 1 ? `<p class="hint" style="margin-top:14px">Der letzte Topf lässt sich nicht löschen.</p>` : ""}

      <div class="actions">
        <button type="button" class="btn" data-cancel>Abbrechen</button>
        <span class="spacer"></span>
        <button type="submit" class="btn primary">Speichern</button>
      </div>
    `, commit);
  }

  function commit() {
    const name = sheet.querySelector("#f-name").value.trim();
    const targetField = sheet.querySelector("#f-target");
    const target = hasTarget ? parseAmount(targetField ? targetField.value : "") : null;
    if (!name || (hasTarget && !(target > 0))) { showErr = true; paint(); return; }

    if (existing) {
      Object.assign(existing, { name, color, targetCents: hasTarget ? target : null });
      announce("Topf gespeichert.");
      state.demo = false;
      persistAndRender();
      closeSheet();
    } else {
      const pot = { id: nextId(), name, color, targetCents: hasTarget ? target : null };
      state.pots.push(pot);
      state.demo = false;
      save();
      announce("Topf angelegt.");
      if (onCreated) onCreated(pot); else { render(); closeSheet(); }
    }
  }

  sheetDelegate = ev => {
    const t = ev.target.closest("button");
    if (!t) return;
    if (t.dataset.color !== undefined && t.dataset.color !== "") { color = Number(t.dataset.color); paint(); }
    else if (t.hasAttribute("data-target-toggle")) { hasTarget = !hasTarget; paint(); }
    else if (t.dataset.move !== undefined && t.dataset.move !== "") { moveTo = Number(t.dataset.move); paint(); }
    else if (t.hasAttribute("data-del")) {
      if (bookings.length && moveTo === null) {
        showErr = false;
        moveTo = 0;
        paint();
        announce("Bitte zuerst wählen, was mit den Buchungen passieren soll.");
        return;
      }
      if (moveTo) bookings.forEach(b => { b.potId = moveTo; });
      else state.savings = state.savings.filter(e => e.potId !== existing.id);
      state.pots = state.pots.filter(p => p.id !== existing.id);
      if (state.potFilter === existing.id) state.potFilter = null;
      state.demo = false;
      persistAndRender();
      closeSheet();
      announce("Topf gelöscht.");
    }
    else if (t.hasAttribute("data-cancel")) closeSheet();
  };

  paint();
}

/* ------------------------------------------------------- Monatsauswahl */
function monthPickerSheet() {
  sheet.innerHTML = "";
  let y = yearOf(state.period);
  const selected = state.period;

  function paint() {
    openSheetKeepFocus(`
      <h2>Monat wählen</h2>
      <div class="when">Aktuell: ${esc(periodLabel(selected))}</div>
      ${switcherHTML(String(y), null, false)}
      <div class="chips months" role="group" aria-label="Monate">
        ${MONTHS_SHORT.map((mn, i) => `<button type="button" data-month="${i + 1}" aria-pressed="${y === yearOf(selected) && i + 1 === monthOf(selected)}">${mn}</button>`).join("")}
      </div>
      <div class="actions">
        <button type="button" class="btn" data-cancel>Abbrechen</button>
        <span class="spacer"></span>
        <button type="button" class="btn primary" data-today>Heute</button>
      </div>
    `, null);
  }

  sheetDelegate = ev => {
    const t = ev.target.closest("button");
    if (!t) return;
    if (t.dataset.nav) { y += Number(t.dataset.nav); paint(); }
    else if (t.dataset.month) { state.period = periodOf(y, Number(t.dataset.month)); persistAndRender(); closeSheet(); }
    else if (t.hasAttribute("data-today")) { state.period = currentPeriod(); persistAndRender(); closeSheet(); }
    else if (t.hasAttribute("data-cancel")) closeSheet();
  };

  paint();
}

/* Neu zeichnen, ohne den Fokus aus einem Eingabefeld zu reißen. */
let sheetDelegate = null;
function openSheetKeepFocus(html, submit) {
  const active = document.activeElement;
  const id = active && active.id ? active.id : null;
  const pos = active && active.setSelectionRange ? active.selectionStart : null;
  sheet.innerHTML = html;
  onSubmit = submit;
  if (!dlg.open) dlg.showModal();
  if (id) {
    const again = sheet.querySelector("#" + id);
    if (again) { again.focus(); if (pos !== null && again.setSelectionRange) { try { again.setSelectionRange(pos, pos); } catch (e) {} } }
  } else {
    const first = sheet.querySelector("input");
    if (first) first.focus();
  }
}

sheet.addEventListener("click", ev => { if (sheetDelegate) sheetDelegate(ev); });
sheet.addEventListener("input", ev => {
  if (ev.target.id === "f-amount" || ev.target.id === "f-title") { /* Werte werden beim Neuzeichnen ausgelesen */ }
});

/* ----------------------------------------------------- Sichern / Laden */
/**
 * Bewusst über ein Textfeld zum Kopieren und Einfügen: ein Download-Link
 * wird in abgeschotteten Rahmen blockiert – genau dort, wo die Sicherung
 * am dringendsten gebraucht wird. Markieren und kopieren geht überall.
 */
function dataSheet() {
  sheet.innerHTML = "";
  let mode = "backup";      // "backup" | "restore"
  let message = null;
  let failed = false;

  function paint() {
    const payload = JSON.stringify({
      version: 1,
      entries: state.entries,
      savings: state.savings,
      nextId: state.nextId
    });

    openSheetKeepFocus(`
      <h2>Daten</h2>
      <div class="when">${state.entries.length} ${state.entries.length === 1 ? "Posten" : "Posten"} ·
        ${state.savings.length} ${state.savings.length === 1 ? "Sparbetrag" : "Sparbeträge"}</div>

      <p class="statusline ${storageOk ? "good" : "bad"}" style="white-space:pre-line">
        ${storageOk
          ? esc(Store.describe())
          : "Dieser Browser lässt die Seite nicht speichern. Sichere den Text unten, sonst gehen die Eingaben beim Neuladen verloren."}
      </p>

      <div class="seg" role="group" aria-label="Sichern oder wiederherstellen" style="margin-bottom:12px">
        <button type="button" data-mode="backup"  aria-pressed="${mode === "backup"}">Sichern</button>
        <button type="button" data-mode="restore" aria-pressed="${mode === "restore"}">Wiederherstellen</button>
      </div>

      ${mode === "backup" ? `
        <div class="field">
          <label for="f-data">Sicherung – markieren und kopieren</label>
          <textarea id="f-data" readonly rows="5" spellcheck="false">${esc(payload)}</textarea>
        </div>
        <button type="button" class="btn" data-copy>In die Zwischenablage kopieren</button>
      ` : `
        <div class="field">
          <label for="f-data">Sicherung hier einfügen</label>
          <textarea id="f-data" rows="5" spellcheck="false" placeholder='{"version":1,"entries":[…' ></textarea>
        </div>
        <p class="hint" style="margin:0">Ersetzt alle aktuellen Daten durch die eingefügte Sicherung.</p>
      `}

      ${message ? `<p class="${failed ? "err" : "statusline good"}" style="margin-top:10px">${esc(message)}</p>` : ""}

      <div class="destructive">
        <button type="button" class="danger" data-wipe>Alle Daten löschen</button>
      </div>

      <div class="actions">
        <button type="button" class="btn" data-cancel>Schließen</button>
        <span class="spacer"></span>
        ${mode === "restore" ? `<button type="button" class="btn primary" data-restore>Wiederherstellen</button>` : ""}
      </div>
    `, null);
  }

  function restore() {
    const raw = sheet.querySelector("#f-data").value.trim();
    if (!raw) { failed = true; message = "Bitte zuerst eine Sicherung einfügen."; paint(); return; }
    let parsed;
    try { parsed = JSON.parse(raw); }
    catch (e) { failed = true; message = "Das ist keine gültige Sicherung – der Text lässt sich nicht lesen."; paint(); return; }
    if (!parsed || !Array.isArray(parsed.entries) || !Array.isArray(parsed.savings)) {
      failed = true; message = "Das ist keine gültige Sicherung – Posten und Sparbeträge fehlen."; paint(); return;
    }
    state.entries = parsed.entries;
    state.savings = parsed.savings;
    state.nextId = Number(parsed.nextId) > 0
      ? Number(parsed.nextId)
      : Math.max(0, ...parsed.entries.map(e => e.id), ...parsed.savings.map(e => e.id)) + 1;
    state.demo = false;
    persistAndRender();
    failed = false;
    message = `${parsed.entries.length} Posten und ${parsed.savings.length} Sparbeträge übernommen.`;
    mode = "backup";
    paint();
    announce(message);
  }

  sheetDelegate = ev => {
    const t = ev.target.closest("button");
    if (!t) return;
    if (t.dataset.mode) { mode = t.dataset.mode; message = null; paint(); }
    else if (t.hasAttribute("data-copy")) {
      const field = sheet.querySelector("#f-data");
      field.select();
      field.setSelectionRange(0, field.value.length);
      let done = false;
      try { done = document.execCommand("copy"); } catch (e) { done = false; }
      if (navigator.clipboard && !done) {
        navigator.clipboard.writeText(field.value).then(
          () => { failed = false; message = "Kopiert."; paint(); },
          () => { failed = true; message = "Kopieren ging nicht – bitte den markierten Text von Hand kopieren."; paint(); }
        );
        return;
      }
      failed = !done;
      message = done ? "Kopiert." : "Kopieren ging nicht – bitte den markierten Text von Hand kopieren.";
      paint();
    }
    else if (t.hasAttribute("data-restore")) restore();
    else if (t.hasAttribute("data-wipe")) {
      if (t.dataset.armed === "1") {
        state = Object.assign(blank(), { tab: state.tab, period: state.period, year: state.year });
        persistAndRender();
        closeSheet();
        announce("Alle Daten gelöscht.");
      } else {
        t.dataset.armed = "1";
        t.textContent = "Wirklich alles löschen? Noch einmal tippen.";
      }
    }
    else if (t.hasAttribute("data-cancel")) closeSheet();
  };

  paint();
}

/* ============================================================== Verdrahtung */
const fab = document.getElementById("fab");
const fabText = document.getElementById("fabText");

function render() {
  if (state.tab === "month") renderMonth();
  else if (state.tab === "year") renderYear();
  else renderSavings();

  // Warnung vorn anstellen – sie betrifft jeden Reiter.
  if (!storageOk) {
    const warn = el(`<div class="banner warn">
      <div>
        <strong>${Store.kind === "datei" ? "Die Datendatei lässt sich nicht schreiben." : "Dieser Browser lässt die Seite nicht speichern."}</strong>
        Deine Eingaben bleiben nur, solange dieses Fenster offen ist – beim Neuladen sind sie weg.
        Häufige Ursachen: privater Modus, blockierte Site-Daten, oder die Seite läuft in einem
        abgeschotteten Rahmen.
        <button type="button" data-act="data-sheet">Daten sichern oder wiederherstellen</button>
      </div>
    </div>`);
    view.insertBefore(warn, view.firstChild);
  }

  document.querySelectorAll(".tabs button").forEach(b =>
    b.setAttribute("aria-selected", String(b.dataset.tab === state.tab)));

  if (state.tab === "year") {
    fab.hidden = true;
  } else {
    fab.hidden = false;
    fabText.textContent = state.tab === "month" ? "Posten" : "Einzahlen";
  }
  view.scrollTop = 0;
}

function persistAndRender() {
  const ok = save();
  render();
  if (!ok) announce("Achtung: Diese Eingabe konnte nicht dauerhaft gespeichert werden.");
}

/* Tabs */
document.querySelectorAll(".tabs button").forEach(b => {
  b.addEventListener("click", () => { state.tab = b.dataset.tab; save(); render(); });
});

/* Klicks innerhalb der aktiven Ansicht */
view.addEventListener("click", ev => {
  const nav = ev.target.closest("[data-nav]");
  if (nav) {
    const step = Number(nav.dataset.nav);
    if (state.tab === "month") state.period += step; else state.year += step;
    persistAndRender();
    return;
  }
  if (ev.target.closest("[data-pick]")) { monthPickerSheet(); return; }

  const entry = ev.target.closest("[data-entry]");
  if (entry) {
    const e = state.entries.find(x => x.id === Number(entry.dataset.entry));
    if (e) entrySheet(e, e.type);
    return;
  }

  const sav = ev.target.closest("[data-sav]");
  if (sav) {
    const e = state.savings.find(x => x.id === Number(sav.dataset.sav));
    if (e) savingsSheet(e.period, e);
    return;
  }

  const potFilter = ev.target.closest("[data-pot-filter]");
  if (potFilter) {
    const raw = potFilter.dataset.potFilter;
    state.potFilter = raw === "" ? null : Number(raw);
    persistAndRender();
    return;
  }
  if (ev.target.closest("[data-pot-new]")) { potSheet(null, () => { render(); closeSheet(); }); return; }
  const potEdit = ev.target.closest("[data-pot-edit]");
  if (potEdit) { potSheet(potOf(Number(potEdit.dataset.potEdit)), null); return; }

  const addSav = ev.target.closest("[data-addsav]");
  if (addSav) { savingsSheet(Number(addSav.dataset.addsav), null); return; }

  const goto = ev.target.closest("[data-goto]");
  if (goto) { state.period = Number(goto.dataset.goto); state.tab = "month"; persistAndRender(); return; }

  if (ev.target.closest('[data-act="data-sheet"]')) { dataSheet(); return; }

  if (ev.target.closest('[data-act="clear-demo"]')) {
    state = Object.assign(blank(), { tab: state.tab, period: state.period, year: state.year });
    persistAndRender();
    announce("Beispieldaten gelöscht. Du startest jetzt leer.");
    return;
  }
});

/* Schwebende Schaltfläche */
fab.addEventListener("click", () => {
  if (state.tab === "month") {
    entrySheet(null, "expense");
  } else {
    const p = yearOf(state.period) === state.year ? state.period : periodOf(state.year, 1);
    savingsSheet(p, null);
  }
});

/* Hell / dunkel */
const THEME_KEY = "kassenbuch.theme";
function applyTheme(t) {
  if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
}
try { applyTheme(localStorage.getItem(THEME_KEY)); } catch (e) {}

document.getElementById("dataBtn").addEventListener("click", dataSheet);

document.getElementById("themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const isDark = cur ? cur === "dark" : systemDark;
  const next = isDark ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  render();
  announce(next === "dark" ? "Dunkle Darstellung." : "Helle Darstellung.");
});

/* Start */
state = load();
save();
render();
</script>
