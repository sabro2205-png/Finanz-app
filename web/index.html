<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kassenbuch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ------------------------------------------------------------------ Tokens */
:root {
  color-scheme: light;
  --plane:#e8eae9; --surface:#fbfcfb; --card:#ffffff; --card-2:#f4f6f5;
  --ink:#121614; --ink-2:#5a615e; --ink-3:#8b918e;
  --rule:#dde1df; --rule-strong:#c4c9c6;
  --brand:#0f4c52; --brand-ink:#ffffff; --brand-soft:#dcebeb;
  --in:#2a78d6; --out:#eb6834; --save:#1baf7a;
  --critical:#d03b3b; --good:#006300;
  --chart-surface:#ffffff; --grid:#e6e9e7; --axis:#c4c9c6;
  --shadow:0 1px 2px rgba(18,22,20,.06), 0 18px 40px -22px rgba(18,22,20,.35);
  --warn-bg:#fdf0e6; --warn-border:#e8b98f;
  --pot-0:#1baf7a; --pot-1:#eda100; --pot-2:#e87ba4; --pot-3:#008300; --pot-4:#4a3aa7; --pot-5:#e34948;
  --ring:0 0 0 3px rgba(15,76,82,.30);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane:#0b0d0d; --surface:#151817; --card:#1c201f; --card-2:#232827;
    --ink:#f2f4f3; --ink-2:#a8b0ad; --ink-3:#7d8481;
    --rule:#2a302e; --rule-strong:#3b433f;
    --brand:#6fc9d0; --brand-ink:#082022; --brand-soft:#16302f;
    --in:#3987e5; --out:#d95926; --save:#199e70;
    --critical:#e66767; --good:#0ca30c;
    --chart-surface:#1c201f; --grid:#2a302e; --axis:#3b433f;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 18px 40px -22px rgba(0,0,0,.8);
    --warn-bg:#33231a; --warn-border:#7a4f2e;
    --pot-0:#199e70; --pot-1:#c98500; --pot-2:#d55181; --pot-3:#008300; --pot-4:#9085e9; --pot-5:#e66767;
    --ring:0 0 0 3px rgba(111,201,208,.35);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane:#0b0d0d; --surface:#151817; --card:#1c201f; --card-2:#232827;
  --ink:#f2f4f3; --ink-2:#a8b0ad; --ink-3:#7d8481;
  --rule:#2a302e; --rule-strong:#3b433f;
  --brand:#6fc9d0; --brand-ink:#082022; --brand-soft:#16302f;
  --in:#3987e5; --out:#d95926; --save:#199e70;
  --critical:#e66767; --good:#0ca30c;
  --chart-surface:#1c201f; --grid:#2a302e; --axis:#3b433f;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 18px 40px -22px rgba(0,0,0,.8);
  --warn-bg:#33231a; --warn-border:#7a4f2e;
  --pot-0:#199e70; --pot-1:#c98500; --pot-2:#d55181; --pot-3:#008300; --pot-4:#9085e9; --pot-5:#e66767;
  --ring:0 0 0 3px rgba(111,201,208,.35);
}

/* ------------------------------------------------------------------ Basis */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin:0; background: var(--plane); color: var(--ink);
  font-family:"Public Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:15px; line-height:1.45;
  min-height:100dvh; display:grid; place-items:center;
  -webkit-font-smoothing: antialiased;
}
@media (min-width:600px){ body { padding:24px; } }
button { font: inherit; color: inherit; }
:focus-visible { outline:none; box-shadow: var(--ring); border-radius:8px; }
@media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }

.num { font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; letter-spacing:-.01em; }

/* ------------------------------------------------------------------ Rahmen */
.app {
  width:min(100%, 440px); height:100dvh;
  background: var(--surface); display:flex; flex-direction:column; overflow:hidden;
  position:relative;
}
@media (min-width:600px){
  .app { height:min(calc(100dvh - 48px), 900px); border-radius:26px; border:1px solid var(--rule); box-shadow: var(--shadow); }
}

.appbar {
  display:flex; align-items:center; gap:10px;
  padding:14px 16px 10px; border-bottom:1px solid var(--rule); background: var(--surface);
}
.appbar .iconbtn + .iconbtn { margin-left:6px; }
.mark {
  width:30px; height:30px; border-radius:9px; background: var(--brand); color: var(--brand-ink);
  display:grid; place-items:center; font-weight:700; font-size:15px; flex:none;
}
.appbar h1 { margin:0; font-size:16px; font-weight:600; letter-spacing:-.01em; }
.appbar p { margin:0; font-size:11.5px; color: var(--ink-3); }
.iconbtn {
  flex:none; width:34px; height:34px; border-radius:10px;
  border:1px solid var(--rule); background: var(--card); display:grid; place-items:center; cursor:pointer;
}
.iconbtn:hover { border-color: var(--rule-strong); }

.content { flex:1; overflow-y:auto; overscroll-behavior:contain; padding:12px 16px 96px; }

/* ------------------------------------------------------------------ Banner */
.banner {
  display:flex; gap:10px; align-items:flex-start;
  background: var(--brand-soft); border:1px solid var(--rule); border-radius:12px;
  padding:10px 12px; margin-bottom:12px; font-size:12.5px; color: var(--ink-2);
}
.banner strong { color: var(--ink); font-weight:600; }
.banner.warn { background: var(--warn-bg); border-color: var(--warn-border); }
.banner.warn strong { display:block; margin-bottom:2px; }
.banner button {
  margin-top:4px; background:none; border:none; padding:0; cursor:pointer;
  color: var(--brand); font-weight:600; font-size:12.5px; text-decoration:underline; text-underline-offset:3px;
}

/* -------------------------------------------------------------- Umschalter */
.switcher { display:flex; align-items:center; gap:4px; margin-bottom:12px; }
.switcher .navbtn {
  width:36px; height:36px; border-radius:10px; border:1px solid var(--rule);
  background: var(--card); cursor:pointer; display:grid; place-items:center; flex:none;
}
.switcher .navbtn:hover { border-color: var(--rule-strong); }
.switcher .navbtn svg { width:18px; height:18px; }
.switcher .label {
  flex:1; text-align:center; background:none; border:none; cursor:pointer; padding:4px 2px; border-radius:10px;
}
.switcher .label[disabled] { cursor:default; }
.switcher .label b { display:block; font-size:17px; font-weight:600; letter-spacing:-.01em; }
.switcher .label span { display:block; font-size:11px; color: var(--ink-3); }

/* ----------------------------------------------------------------- Flächen */
.card { background: var(--card); border:1px solid var(--rule); border-radius:14px; }
.card + .card, .stack > * + * { margin-top:12px; }
.stack { display:block; }

.hero { padding:16px; }
.hero .duo { display:flex; gap:12px; }
.hero .duo > div { flex:1; min-width:0; }
.hero .duo > div:last-child { text-align:right; }
.lbl { font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color: var(--ink-3); }
.hero .duo .val { font-size:16px; font-weight:600; margin-top:1px; }
.dot { width:9px; height:9px; border-radius:3px; display:inline-block; vertical-align:baseline; margin-right:5px; }

.hero hr { border:none; border-top:1px solid var(--rule); margin:14px 0; }
.hero .rest { font-size:32px; font-weight:600; letter-spacing:-.02em; margin-top:2px; line-height:1.15; }
.hero .rest.neg { color: var(--critical); }
.meter { height:8px; border-radius:4px; background: var(--card-2); overflow:hidden; margin-top:12px; display:flex; }
.meter i { display:block; height:100%; }
.hero .note { font-size:12.5px; color: var(--ink-2); margin-top:8px; }
.hero .note .delta { font-weight:600; }

/* ---------------------------------------------------------------- Abschnitt */
.sechead { display:flex; align-items:baseline; gap:8px; margin:20px 2px 8px; }
.sechead h2 { margin:0; font-size:14px; font-weight:600; letter-spacing:.01em; }
.sechead .sum { margin-left:auto; font-size:14px; font-weight:600; }

.rows { padding:2px 0; }
.row {
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:none; border:none; padding:10px 14px; cursor:pointer;
}
.row + .row { border-top:1px solid var(--rule); }
.row:hover { background: var(--card-2); }
.row .t { flex:1; min-width:0; }
.row .t b { display:block; font-weight:500; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row .t .meta { display:flex; align-items:center; gap:5px; flex-wrap:wrap;
                font-size:11.5px; color: var(--ink-3); margin-top:2px; }
.row .a { font-size:14.5px; font-weight:500; flex:none; }
.tag {
  display:inline-flex; align-items:center; gap:3px; font-size:10.5px; font-weight:600;
  color: var(--ink-3); border:1px solid var(--rule); border-radius:5px; padding:0 4px; line-height:16px;
}

.cathead { display:flex; align-items:center; gap:9px; padding:12px 14px 8px; }
.cathead .t { flex:1; min-width:0; }
.cathead .t b { display:block; font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cathead .t > span { display:block; font-size:11.5px; color: var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cathead .a { font-size:14.5px; font-weight:600; white-space:nowrap; flex:none; }
.catbar { height:6px; border-radius:3px; background: var(--card-2); margin:0 14px 10px; overflow:hidden; }
.catbar i { display:block; height:100%; border-radius:3px; }

.potfilter { display:flex; gap:7px; overflow-x:auto; padding:2px 0 10px; scrollbar-width:none; }
.potfilter::-webkit-scrollbar { display:none; }
.potfilter button {
  flex:none; display:flex; align-items:center; gap:6px; white-space:nowrap;
  padding:7px 12px; border-radius:9px; border:1px solid var(--rule-strong);
  background: var(--card); cursor:pointer; font-size:13px;
}
.potfilter button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight:600; }
.potfilter button.add { border-style:dashed; color: var(--ink-2); }
.stack-bar { display:flex; gap:2px; height:10px; margin:0 14px 12px; }
.stack-bar i { display:block; border-radius:3px; min-width:3px; }
.potbar { display:block; height:5px; border-radius:3px; background: var(--card-2); margin-top:5px; overflow:hidden; max-width:190px; }
.potbar i { display:block; height:100%; border-radius:3px; }
.row > .dot { flex:none; align-self:center; margin-right:0; }
.empty { padding:18px; }
.empty h3 { margin:0 0 6px; font-size:15px; font-weight:600; }
.empty p { margin:0; font-size:13px; color: var(--ink-2); }
.hint { font-size:12.5px; color: var(--ink-3); margin:10px 2px 0; }

/* ------------------------------------------------------------------ Charts */
.chartcard { padding:14px; }
.chartcard h3 { margin:0 0 2px; font-size:14px; font-weight:600; }
.chartcard .sub { font-size:11.5px; color: var(--ink-3); margin-bottom:10px; }
.chartwrap { position:relative; }
.chartwrap svg { display:block; width:100%; height:auto; touch-action: pan-y; }
.legend { display:flex; flex-wrap:wrap; gap:14px; margin-top:10px; }
.legend span { display:flex; align-items:center; gap:6px; font-size:11.5px; color: var(--ink-2); }
.legend .line { width:14px; height:0; border-top:2px solid; border-radius:2px; }
.legend .line.dashed { border-top-style:dashed; }
.tip {
  position:absolute; pointer-events:none; opacity:0; transform:translate(-50%,-100%);
  background: var(--card); border:1px solid var(--rule-strong); border-radius:10px;
  box-shadow: var(--shadow); padding:7px 9px; font-size:11.5px; white-space:nowrap; z-index:5;
  transition:opacity .1s;
}
.tip b { display:block; font-size:11px; font-weight:600; margin-bottom:3px; color: var(--ink); }
.tip .r { display:flex; gap:10px; align-items:center; color: var(--ink-2); }
.tip .r .k { flex:1; display:flex; align-items:center; gap:5px; }
.tip .r .v { color: var(--ink); font-weight:500; }

/* ------------------------------------------------------------------ Tabelle */
table { width:100%; border-collapse:collapse; }
th, td { padding:8px 6px; font-size:12.5px; text-align:right; }
th { font-size:10.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color: var(--ink-3); }
th:first-child, td:first-child { text-align:left; padding-left:14px; }
th:last-child, td:last-child { padding-right:14px; }
tbody tr { border-top:1px solid var(--rule); cursor:pointer; }
tbody tr:hover { background: var(--card-2); }
tbody tr.now td:first-child::after { content:"heute"; margin-left:6px; font-size:9.5px; font-family:"Public Sans",sans-serif; color: var(--brand); font-weight:700; letter-spacing:.04em; text-transform:uppercase; }
td.zero { color: var(--ink-3); }

/* ---------------------------------------------------------------- Tableiste */
.tabs {
  display:flex; border-top:1px solid var(--rule); background: var(--surface);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));
}
.tabs button {
  flex:1; background:none; border:none; cursor:pointer; padding:6px 2px 4px; border-radius:12px;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:11px; font-weight:500; color: var(--ink-3);
}
.tabs button svg { width:22px; height:22px; }
.tabs button .pill { display:grid; place-items:center; width:52px; height:26px; border-radius:13px; transition:background .15s; }
.tabs button[aria-selected="true"] { color: var(--brand); font-weight:600; }
.tabs button[aria-selected="true"] .pill { background: var(--brand-soft); }

.fab {
  position:absolute; right:16px; bottom:78px; z-index:4;
  height:50px; padding:0 18px; border-radius:16px; border:none; cursor:pointer;
  background: var(--brand); color: var(--brand-ink); font-weight:600; font-size:14px;
  display:flex; align-items:center; gap:7px; box-shadow: var(--shadow);
}
.fab svg { width:18px; height:18px; }
.fab[hidden] { display:none; }

/* ------------------------------------------------------------- Zeitraum */
.range { display:flex; align-items:center; gap:8px; }
.range button {
  flex:1; min-width:0; text-align:left; padding:8px 10px; border-radius:10px;
  border:1px solid var(--rule-strong); background: var(--surface); cursor:pointer;
}
.range button[aria-pressed="true"] { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
.range button span { display:block; font-size:10.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color: var(--ink-3); }
.range button b { display:block; font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.range .dash { color: var(--ink-3); flex:none; }
.picker { margin-top:10px; padding:10px; border:1px solid var(--rule); border-radius:12px; background: var(--card-2); }
.picker .switcher.compact { margin-bottom:8px; justify-content:center; gap:10px; }
.picker .switcher.compact .navbtn { width:30px; height:30px; }
.picker .switcher.compact .y { font-size:15px; font-weight:600; min-width:52px; text-align:center; }
.picker .chips button[disabled] { opacity:.35; cursor:not-allowed; }
.picker .subtle { margin-top:8px; }
.rangenote { margin:8px 0 0; font-size:12px; color: var(--ink-2); }

/* ------------------------------------------------------------------ Dialoge */
dialog {
  border:none; padding:0; background:transparent; color: var(--ink);
  max-width:min(100vw - 24px, 420px); width:100%;
}
dialog::backdrop { background: rgba(8,12,11,.5); }
.sheet { background: var(--card); border:1px solid var(--rule); border-radius:18px; padding:18px; }
.sheet h2 { margin:0 0 2px; font-size:17px; font-weight:600; }
.sheet .when { font-size:12px; color: var(--ink-3); margin-bottom:14px; }
.field { margin-bottom:12px; }
.field > label { display:block; font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color: var(--ink-3); margin-bottom:5px; }
input[type=text] {
  width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--rule-strong);
  background: var(--surface); color: var(--ink); font:inherit;
}
input[type=text].num { font-family:"IBM Plex Mono", ui-monospace, monospace; }
input[type=text]::placeholder { color: var(--ink-3); }
input[type=text][aria-invalid="true"] { border-color: var(--critical); }

.seg { display:flex; gap:0; border:1px solid var(--rule-strong); border-radius:10px; overflow:hidden; }
.seg button { flex:1; padding:9px 6px; background: var(--surface); border:none; cursor:pointer; font-size:13.5px; font-weight:500; }
.seg button + button { border-left:1px solid var(--rule-strong); }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); font-weight:600; }

.chips { display:flex; flex-wrap:wrap; gap:7px; }
.chips button {
  padding:7px 11px; border-radius:9px; border:1px solid var(--rule-strong);
  background: var(--surface); cursor:pointer; font-size:13px;
}
.chips button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight:600; }
.chips.months button { flex:1 0 60px; text-align:center; }
.chips button .dot { margin-right:0; }
.chips button { display:inline-flex; align-items:center; gap:6px; }
.chips button.ghost { border-style:dashed; color: var(--ink-2); }
.chips.colors button { padding:6px; }
.chips.colors .swatch { display:block; width:22px; height:22px; border-radius:7px; }
.chips.colors button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); }

.toggle { display:flex; align-items:center; gap:12px; padding:10px 0 2px; }
.toggle .t { flex:1; }
.toggle .t b { display:block; font-size:14px; font-weight:500; }
.toggle .t span { display:block; font-size:12px; color: var(--ink-3); }
.toggle button {
  flex:none; width:46px; height:27px; border-radius:14px; border:1px solid var(--rule-strong);
  background: var(--card-2); cursor:pointer; padding:0; position:relative; transition:background .15s, border-color .15s;
}
.toggle button::after {
  content:""; position:absolute; top:2px; left:2px; width:21px; height:21px; border-radius:50%;
  background: var(--ink-3); transition:transform .15s, background .15s;
}
.toggle button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); }
.toggle button[aria-pressed="true"]::after { transform:translateX(19px); background: var(--brand-ink); }

.err { font-size:12.5px; color: var(--critical); margin:2px 0 10px; }
textarea {
  width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--rule-strong);
  background: var(--surface); color: var(--ink); font-family:"IBM Plex Mono", ui-monospace, monospace;
  font-size:11px; line-height:1.5; resize:vertical;
}
.statusline { font-size:12.5px; margin:0 0 12px; padding:8px 10px; border-radius:9px; }
.statusline.good { background: var(--card-2); color: var(--ink-2); }
.statusline.bad { background: var(--warn-bg); border:1px solid var(--warn-border); color: var(--ink); }
.sheet .actions { display:flex; gap:8px; align-items:center; margin-top:16px; }
.sheet .actions .spacer { flex:1; }
.btn { padding:10px 16px; border-radius:10px; border:1px solid var(--rule-strong); background: var(--surface); cursor:pointer; font-size:14px; font-weight:500; }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight:600; }
.danger { background:none; border:none; padding:6px 0; cursor:pointer; font-size:13px; font-weight:500; color: var(--critical); text-align:left; }
.subtle { background:none; border:none; padding:6px 0; cursor:pointer; font-size:13px; font-weight:500; color: var(--brand); text-align:left; }
.destructive { border-top:1px solid var(--rule); margin-top:14px; padding-top:8px; display:flex; flex-direction:column; align-items:flex-start; }
.sr { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
</style>
</head>
<body>

<div class="app">
  <header class="appbar">
    <div class="mark" aria-hidden="true">K</div>
    <div>
      <h1>Kassenbuch</h1>
      <p>Web-Vorschau der Android-App</p>
    </div>
    <button class="iconbtn" id="dataBtn" type="button" title="Daten sichern oder wiederherstellen" aria-label="Daten sichern oder wiederherstellen" style="margin-left:auto">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <ellipse cx="12" cy="6" rx="7.5" ry="3"/><path d="M4.5 6v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6"/><path d="M4.5 12v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/>
      </svg>
    </button>
    <button class="iconbtn" id="themeBtn" type="button" title="Hell / dunkel umschalten" aria-label="Hell oder dunkel umschalten">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>
      </svg>
    </button>
  </header>

  <main class="content" id="view"></main>

  <button class="fab" id="fab" type="button" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    <span id="fabText">Posten</span>
  </button>

  <nav class="tabs" role="tablist" aria-label="Bereiche">
    <button type="button" role="tab" data-tab="month" aria-selected="true">
      <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="16" rx="2.5"/><path d="M3.5 9.5h17M8 2.8v3.4M16 2.8v3.4"/></svg></span>
      Monat
    </button>
    <button type="button" role="tab" data-tab="year" aria-selected="false">
      <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 20h16M7 20V11M12 20V5M17 20v-6"/></svg></span>
      Jahr
    </button>
    <button type="button" role="tab" data-tab="savings" aria-selected="false">
      <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 12.5a7 7 0 0 1 7-7h2.5a6 6 0 0 1 5.9 5H21v3.5h-1.8a6 6 0 0 1-2.2 3V20h-3v-2h-3v2h-3v-3.2a7 7 0 0 1-2-4.3Z"/><circle cx="15.5" cy="10.5" r=".9" fill="currentColor" stroke="none"/></svg></span>
      Erspartes

</div>

<dialog id="dlg"><form method="dialog" class="sheet" id="sheet"></form></dialog>
<div class="sr" id="live" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ==================================================================
   Kassenbuch – Web-Vorschau
   Die Rechenlogik ist 1:1 aus der Android-App portiert
   (domain/FinanceCalculator.kt, util/Period.kt, util/Money.kt).
   Daten liegen ausschliesslich im localStorage dieses Browsers.
   ================================================================== */

/* ------------------------------------------------------------ Monatsindex */
const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const MONTHS_SHORT = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];

const periodOf = (year, month) => year * 12 + (month - 1);
const yearOf   = p => Math.floor(p / 12);
const monthOf  = p => ((p % 12) + 12) % 12 + 1;
const firstOfYear = y => periodOf(y, 1);
const lastOfYear  = y => periodOf(y, 12);
const monthName   = p => MONTHS[monthOf(p) - 1];
const periodLabel = p => monthName(p) + " " + yearOf(p);
const shortLabel  = p => MONTHS_SHORT[monthOf(p) - 1] + " " + yearOf(p);
const currentPeriod = () => { const d = new Date(); return periodOf(d.getFullYear(), d.getMonth() + 1); };
const currentYear   = () => new Date().getFullYear();

/* ------------------------------------------------------------------ Geld */
const eur = new Intl.NumberFormat("de-DE", { style:"currency", currency:"EUR" });
const plain = new Intl.NumberFormat("de-DE", { minimumFractionDigits:2, maximumFractionDigits:2 });

const fmt = cents => eur.format(cents / 100);
const fmtSigned = cents => (cents > 0 ? "+" : "") + fmt(cents);
const fmtInput = cents => plain.format(cents / 100);

function fmtCompact(cents) {
  const e = cents / 100;
  if (Math.abs(e) >= 1000000) return (e / 1000000).toFixed(1).replace(".", ",") + " Mio";
  if (Math.abs(e) >= 1000) return (e / 1000).toFixed(1).replace(".", ",") + "T";
  return Math.round(e).toString();
}

/** Akzeptiert "1.234,56", "12.50", "50", "-250". */
function parseAmount(input) {
  let t = String(input).trim().replace(/€/g, "").replace(/[\s  ]/g, "");
  if (!t) return null;
  const hasComma = t.includes(",");
  const dots = (t.match(/\./g) || []).length;
  if (hasComma) t = t.replace(/\./g, "").replace(",", ".");
  else if (dots === 1 && t.split(".").pop().length <= 2 && t.split(".").pop().length >= 1) { /* 12.50 */ }
  else if (dots >= 1) t = t.replace(/\./g, "");
  if (!/^-?\d*\.?\d*$/.test(t) || !/\d/.test(t)) return null;
  const v = parseFloat(t);
  if (!isFinite(v)) return null;
  return Math.round(v * 100);
}

const percentOf = (part, total) => total <= 0 ? 0 : Math.round(part / total * 100);

/* -------------------------------------------------------------- Kategorien */
const CATEGORIES = [
  { id:"RENT",         label:"Miete" },
  { id:"FINANCING",    label:"Finanzierung" },
  { id:"SUBSCRIPTION", label:"Abos" },
  { id:"OTHER",        label:"Sonstige Ausgaben" }
];
const catLabel = id => (CATEGORIES.find(c => c.id === id) || CATEGORIES[3]).label;

/* ------------------------------------------------------- Rechenlogik (Port) */
const isActiveIn = (e, p) => e.startPeriod <= p && (e.endPeriod === null || e.endPeriod >= p);

function buildMonthState(period, current, previous) {
  const income = current.filter(e => e.type === "income");
  const expenses = current.filter(e => e.type === "expense");

  const groups = CATEGORIES.map(cat => {
    const items = expenses.filter(e => (e.category || "OTHER") === cat.id);
    if (!items.length) return null;
    return { category: cat.id, entries: items, totalCents: items.reduce((s, e) => s + e.amountCents, 0) };
  }).filter(Boolean);

  const prevIncome = previous.filter(e => e.type === "income").reduce((s, e) => s + e.amountCents, 0);
  const prevExpense = previous.filter(e => e.type === "expense").reduce((s, e) => s + e.amountCents, 0);

  const incomeTotal = income.reduce((s, e) => s + e.amountCents, 0);
  const expenseTotal = expenses.reduce((s, e) => s + e.amountCents, 0);

  return {
    period, income, expenseGroups: groups, incomeTotal, expenseTotal,
    balance: incomeTotal - expenseTotal,
    previousBalance: prevIncome - prevExpense,
    balanceDelta: (incomeTotal - expenseTotal) - (prevIncome - prevExpense),
    hasPreviousData: previous.length > 0
  };
}

function buildYearState(year, entries) {
  const months = [];
  for (let m = 1; m <= 12; m++) {
    const p = periodOf(year, m);
    const active = entries.filter(e => isActiveIn(e, p));
    const inc = active.filter(e => e.type === "income").reduce((s, e) => s + e.amountCents, 0);
    const exp = active.filter(e => e.type === "expense").reduce((s, e) => s + e.amountCents, 0);
    months.push({ period:p, incomeCents:inc, expenseCents:exp, balanceCents: inc - exp });
  }
  const incomeTotal = months.reduce((s, m) => s + m.incomeCents, 0);
  const expenseTotal = months.reduce((s, m) => s + m.expenseCents, 0);
  const activeMonths = months.filter(m => m.incomeCents !== 0 || m.expenseCents !== 0).length;
  const balanceTotal = incomeTotal - expenseTotal;
  return {
    year, months, incomeTotal, expenseTotal, balanceTotal, activeMonths,
    averageBalance: activeMonths === 0 ? 0 : Math.trunc(balanceTotal / activeMonths)
  };
}

function buildSavingsState(year, entries, startBalanceCents) {
  let running = startBalanceCents;
  const months = [];
  for (let m = 1; m <= 12; m++) {
    const p = periodOf(year, m);
    const items = entries.filter(e => e.period === p);
    const net = items.reduce((s, e) => s + e.amountCents, 0);
    running += net;
    months.push({ period:p, entries:items, netCents:net, runningBalanceCents:running });
  }
  const yearTotal = months.reduce((s, m) => s + m.netCents, 0);
  const withEntries = months.filter(m => m.entries.length > 0);
  return {
    year, startBalanceCents, months,
    yearTotalCents: yearTotal,
    endBalanceCents: startBalanceCents + yearTotal,
    monthsWithEntries: withEntries.length,
    averagePerMonth: withEntries.length === 0 ? 0 : Math.trunc(yearTotal / withEntries.length),
    bestMonth: withEntries.length === 0 ? null : withEntries.reduce((a, b) => b.netCents > a.netCents ? b : a)
  };
}

/* ------------------------------------------------------------- Speicherung */
const KEY = "kassenbuch.v1";
let state = null;

/* Sechs Topffarben, ein zusammenhängender Ausschnitt der geprüften Reihe.
   Mehr Töpfe sind erlaubt, die Farben wiederholen sich dann – der Name steht
   immer daneben, die Farbe trägt die Unterscheidung nie allein. */
const POT_COLORS = 6;
const potColor = pot => `var(--pot-${(pot ? pot.color : 0) % POT_COLORS})`;

function blank() {
  return { entries: [], savings: [], pots: [], nextId: 1, demo: false,
           tab: "month", period: currentPeriod(), year: currentYear(), potFilter: null };
}

/**
 * Ältere Stände kennen noch keine Töpfe. Dort war die Bezeichnung jedes
 * Sparbetrags faktisch schon der Topfname – daraus werden die Töpfe gebildet,
 * ohne dass etwas verloren geht.
 */
function migratePots(st) {
  if (Array.isArray(st.pots) && st.pots.length) return st;
  st.pots = [];
  const byName = new Map();
  st.savings.forEach(e => {
    if (e.potId != null) return;
    const name = (e.title || "Erspartes").trim() || "Erspartes";
    if (!byName.has(name)) {
      const pot = { id: st.nextId++, name, color: byName.size % POT_COLORS, targetCents: null };
      byName.set(name, pot);
      st.pots.push(pot);
    }
    e.potId = byName.get(name).id;
    e.title = "";
  });
  if (!st.pots.length) {
    st.pots.push({ id: st.nextId++, name: "Erspartes", color: 0, targetCents: null });
  }
  return st;
}

/**
 * Ob dieser Browser der Seite überhaupt erlaubt zu speichern.
 * In einem abgeschotteten Rahmen (sandbox ohne allow-same-origin), im privaten
 * Modus oder bei blockierten Site-Daten wirft schon der Zugriff. Das darf nicht
 * stillschweigend passieren – sonst wähnt man seine Eingaben gespeichert.
 */
let storageOk = true;

/**
 * Zwei Ablagen, eine Schnittstelle.
 *
 * In der Desktop-App reicht die Brücke aus dem Preload-Skript eine echte
 * Datei durch; im Browser bleibt es beim localStorage. Der Rest der App
 * merkt davon nichts.
 */
const Store = (() => {
  const bridge = typeof window !== "undefined" ? window.kassenbuchStore : null;

  if (bridge && typeof bridge.read === "function" && typeof bridge.write === "function") {
    return {
      kind: "datei",
      read: () => bridge.read(),
      write: text => bridge.write(text),
      describe: () => {
        const path = typeof bridge.path === "function" ? bridge.path() : null;
        return path
          ? "Gespeichert in einer Datei auf diesem Gerät:\n" + path
          : "Gespeichert in einer Datei auf diesem Gerät.";
      }
    };
  }

  return {
    kind: "browser",
    read: () => localStorage.getItem(KEY),
    write: text => localStorage.setItem(KEY, text),
    describe: () => "Gespeichert im Browser dieses Geräts. Auf einem anderen Gerät " +
                    "oder in einem anderen Browser sind die Daten nicht vorhanden."
  };
})();

function probeStorage() {
  try {
    if (Store.kind === "datei") {
      Store.read();               // wirft, wenn die Datei nicht lesbar ist
      storageOk = true;
      return storageOk;
    }
    const probe = KEY + ".probe";
    localStorage.setItem(probe, "1");
    const back = localStorage.getItem(probe);
    localStorage.removeItem(probe);
    storageOk = back === "1";
  } catch (e) {
    storageOk = false;
  }
  return storageOk;
}

function load() {
  if (!probeStorage()) return seed();
  try {
    const raw = Store.read();
    if (raw) {
      const p = JSON.parse(raw);
      if (p && Array.isArray(p.entries) && Array.isArray(p.savings)) {
        return migratePots(Object.assign(blank(), p, {
          tab: "month",
          period: p.period ?? currentPeriod(),
          year: p.year ?? currentYear(),
          potFilter: null
        }));
      }
    }
  } catch (e) {
    storageOk = false;
  }
  return seed();
}

/** Speichert und schreibt zur Kontrolle zurück – Erfolg wird nicht angenommen. */
function save() {
  if (!storageOk) return false;
  try {
    const payload = JSON.stringify(state);
    Store.write(payload);
    if (Store.read() !== payload) throw new Error("Rückgelesener Wert weicht ab");
    return true;
  } catch (e) {
    storageOk = false;
    return false;
  }
}

const nextId = () => state.nextId++;

/* --------------------------------------------------------- Beispieldaten */
function seed() {
  const s = blank();
  s.demo = true;
  const y = currentYear();
  const jan = periodOf(y, 1);
  let id = 1;

  const add = (type, category, title, euro, start, recurring, end) => {
    s.entries.push({
      id: id++, type, category, title,
      amountCents: Math.round(euro * 100),
      startPeriod: start,
      endPeriod: recurring ? (end ?? null) : start,
      recurring
    });
  };

  add("income",  null,           "Gehalt",              3200,   jan, true);
  add("income",  null,           "Nebentätigkeit",       250,   jan, true);
  add("income",  null,           "Weihnachtsgeld",      1200,   periodOf(y, 11), false);

  add("expense", "RENT",         "Warmmiete",           1150,   jan, true);
  add("expense", "FINANCING",    "Autokredit",           289,   jan, true);
  add("expense", "FINANCING",    "Handy-Finanzierung",    24.99, jan, true);
  add("expense", "SUBSCRIPTION", "Netflix",               12.99, jan, true);
  add("expense", "SUBSCRIPTION", "Spotify",               10.99, jan, true);
  add("expense", "SUBSCRIPTION", "Fitnessstudio",         29.90, jan, true);
  add("expense", "SUBSCRIPTION", "Handytarif",            19.99, jan, true);
  add("expense", "SUBSCRIPTION", "Zeitung",                8.90, jan, true, periodOf(y, 5)); // gekündigt
  add("expense", "OTHER",        "Lebensmittel",         480,    jan, true);
  add("expense", "OTHER",        "Strom",                 89,    jan, true);
  add("expense", "OTHER",        "Versicherungen",       145,    jan, true);
  add("expense", "OTHER",        "Urlaub Kroatien",      850,    periodOf(y, 7),  false);
  add("expense", "OTHER",        "Winterreifen",         420,    periodOf(y, 10), false);

  s.nextId = id;


  const notgroschen = { id: s.nextId++, name:"Notgroschen",   color:0, targetCents: 500000 };
  const etf         = { id: s.nextId++, name:"ETF-Sparplan",  color:4, targetCents: null };
  const urlaub      = { id: s.nextId++, name:"Urlaubskasse",  color:1, targetCents: 150000 };
  s.pots = [notgroschen, etf, urlaub];

  const put = (pot, period, cents, note) =>
    s.savings.push({ id: s.nextId++, potId: pot.id, period, title: note || "", amountCents: cents });

  // Nur bis zum laufenden Monat – die Prognose füllt den Rest des Jahres.
  const upTo = monthOf(currentPeriod());
  for (let m = 1; m <= upTo; m++) {
    put(etf, periodOf(y, m), 15000);
    if (m !== 7) put(notgroschen, periodOf(y, m), 12000);
    if (m !== 7) put(urlaub, periodOf(y, m), 12000);
  }
  if (upTo >= 7) put(urlaub, periodOf(y, 7), -60000, "Kroatien bezahlt");

  // Vorjahr, damit der Sparstand zu Jahresbeginn nicht bei null steht
  for (let m = 1; m <= 12; m++) {
    put(notgroschen, periodOf(y - 1, m), 15000);
    put(etf, periodOf(y - 1, m), 10000);
  }

  return s;
}

/**
 * Prognose auf Basis des bisherigen Sparverhaltens.
 *
 * Grundlage ist der Durchschnitt über alle Monate, in denen bereits etwas
 * erfasst wurde und die nicht in der Zukunft liegen. Monate ohne Eintrag in
 * der Vergangenheit gelten als Tatsache (0 gespart) und werden nicht
 * hochgerechnet – nur künftige Monate ohne Eintrag.
 */
function buildSavingsForecast(year, allSavings) {
  const today = currentPeriod();

  // Nettobetrag je Monat, über alle Jahre
  const netByPeriod = new Map();
  allSavings.forEach(e => netByPeriod.set(e.period, (netByPeriod.get(e.period) || 0) + e.amountCents));

  const basis = [...netByPeriod.entries()].filter(([p]) => p <= today);
  const basisMonths = basis.length;
  const averageCents = basisMonths === 0 ? 0
    : Math.round(basis.reduce((sum, [, v]) => sum + v, 0) / basisMonths);

  const balanceTodayCents = allSavings
    .filter(e => e.period <= today)
    .reduce((sum, e) => sum + e.amountCents, 0);

  // Stand zu Beginn des angezeigten Jahres
  let running = allSavings
    .filter(e => e.period < firstOfYear(year))
    .reduce((sum, e) => sum + e.amountCents, 0);

  const points = [];
  let openMonths = 0;
  for (let m = 1; m <= 12; m++) {
    const p = periodOf(year, m);
    const hasEntry = netByPeriod.has(p);
    const isForecast = !hasEntry && p > today && basisMonths > 0;
    if (hasEntry) running += netByPeriod.get(p);
    else if (isForecast) { running += averageCents; openMonths++; }
    points.push({ period: p, balanceCents: running, forecast: isForecast });
  }

  return {
    basisMonths, averageCents, openMonths,
    balanceTodayCents,
    points,
    endOfYearCents: points[11].balanceCents,
    in12MonthsCents: balanceTodayCents + averageCents * 12,
    available: basisMonths > 0 && openMonths > 0
  };
}

/* --------------------------------------------------------------- Selektoren */
const entriesFor = p => state.entries
  .filter(e => isActiveIn(e, p))
  .sort((a, b) => b.amountCents - a.amountCents || a.title.localeCompare(b.title, "de"));

const monthState = () => buildMonthState(state.period, entriesFor(state.period), entriesFor(state.period - 1));

const yearState = () => buildYearState(state.year,
  state.entries.filter(e => e.startPeriod <= lastOfYear(state.year) && (e.endPeriod === null || e.endPeriod >= firstOfYear(state.year))));

const potsById = () => new Map(state.pots.map(p => [p.id, p]));
const potOf = id => state.pots.find(p => p.id === id) || null;

/** Alle Sparbuchungen, oder nur die des gewählten Topfes. */
const visibleSavings = () =>
  state.potFilter === null ? state.savings : state.savings.filter(e => e.potId === state.potFilter);

/** Inhalt eines Topfes über die gesamte Zeit. */
const potBalance = potId =>
  state.savings.filter(e => e.potId === potId).reduce((sum, e) => sum + e.amountCents, 0);

const savingsState = () => {
  const shown = visibleSavings();
  const base = buildSavingsState(state.year,
    shown.filter(e => e.period >= firstOfYear(state.year) && e.period <= lastOfYear(state.year)),
    shown.filter(e => e.period < firstOfYear(state.year)).reduce((s, e) => s + e.amountCents, 0));
  base.forecast = buildSavingsForecast(state.year, shown);
  return base;
};

/* ------------------------------------------------------------------ Helfer */
const esc = str => String(str).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const view = document.getElementById("view");
const live = document.getElementById("live");
const announce = msg => { live.textContent = msg; };

function switcherHTML(title, sub, canPick) {
  return `
    <div class="switcher">
      <button class="navbtn" type="button" data-nav="-1" aria-label="Zurück">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="label" type="button" ${canPick ? 'data-pick="1"' : "disabled"}>
        <b>${esc(title)}</b>${sub ? `<span>${esc(sub)}</span>` : ""}
      </button>
      <button class="navbtn" type="button" data-nav="1" aria-label="Weiter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>`;
}

/** "seit Jan 2026" bzw. "Jan 2026 – Mai 2028 · noch 21×" */
function rangeText(e, viewPeriod) {
  if (e.endPeriod === null) return "seit " + shortLabel(e.startPeriod);
  const left = e.endPeriod - viewPeriod + 1;
  const span = shortLabel(e.startPeriod) + " – " + shortLabel(e.endPeriod);
  return left > 0 ? span + " · noch " + left + "×" : span;
}

const recurTag = `<span class="tag"><svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 9a8 8 0 0 1 13.7-3.7L20 7M20 15a8 8 0 0 1-13.7 3.7L4 17"/><path d="M20 3v4h-4M4 21v-4h4"/></svg>monatlich</span>`;

/* =============================================================== Monatstab */
function renderMonth() {
  const m = monthState();
  const isNow = m.period === currentPeriod();
  let h = "";

  if (state.demo) {
    h += `<div class="banner">
      <div>
        <strong>Beispieldaten</strong> – zum Ausprobieren angelegt. Ändere ruhig alles.
        <button type="button" data-act="clear-demo">Alles löschen und leer starten</button>
      </div>
    </div>`;
  }

  h += switcherHTML(periodLabel(m.period), isNow ? "Aktueller Monat" : null, true);

  const used = m.incomeTotal > 0 ? m.expenseTotal / m.incomeTotal : (m.expenseTotal > 0 ? 1 : 0);
  const note = m.incomeTotal <= 0
    ? "Noch keine Einnahmen erfasst."
    : (m.balance < 0
        ? `Die Ausgaben übersteigen die Einnahmen um ${fmt(-m.balance)}.`
        : `${percentOf(m.expenseTotal, m.incomeTotal)} % der Einnahmen sind verplant.`);

  h += `<div class="card hero">
    <div class="duo">
      <div>
        <div class="lbl"><span class="dot" style="background:var(--in)"></span>Einnahmen</div>
        <div class="val num">${fmt(m.incomeTotal)}</div>
      </div>
      <div>
        <div class="lbl"><span class="dot" style="background:var(--out)"></span>Ausgaben</div>
        <div class="val num">${fmt(m.expenseTotal)}</div>
      </div>
    </div>
    <hr>
    <div class="lbl">Bleibt übrig</div>
    <div class="rest num ${m.balance < 0 ? "neg" : ""}">${fmt(m.balance)}</div>
    <div class="meter" role="img" aria-label="${percentOf(m.expenseTotal, m.incomeTotal)} Prozent der Einnahmen sind durch Ausgaben gebunden">
      <i style="width:${Math.min(used, 1) * 100}%;background:${used > 1 ? "var(--critical)" : "var(--out)"}"></i>
    </div>
    <p class="note">${esc(note)}${
      m.hasPreviousData
        ? ` <span class="delta">Gegenüber ${esc(monthName(m.period - 1))}: <span class="num">${fmtSigned(m.balanceDelta)}</span></span>`
        : ""
    }</p>
  </div>`;

  if (!m.income.length && !m.expenseGroups.length) {
    h += `<div class="card empty">
      <h3>Noch nichts erfasst</h3>
      <p>Tippe unten rechts auf „Posten“, um eine Einnahme oder Ausgabe hinzuzufügen.
      Feste Posten wie Miete, Finanzierung oder Abos legst du als <em>monatlich wiederkehrend</em> an –
      sie erscheinen dann automatisch in jedem Folgemonat.</p>
    </div>`;
    view.innerHTML = h;
    return;
  }

  h += `<div class="sechead"><h2>Einnahmen</h2><span class="sum num" style="color:var(--in)">${fmt(m.incomeTotal)}</span></div>`;
  if (!m.income.length) {
    h += `<div class="card empty"><p>Noch keine Einnahmen in diesem Monat.</p></div>`;
  } else {
    h += `<div class="card rows">` + m.income.map(entryRowHTML).join("") + `</div>`;
  }

  h += `<div class="sechead"><h2>Ausgaben</h2><span class="sum num" style="color:var(--out)">${fmt(m.expenseTotal)}</span></div>`;
  if (!m.expenseGroups.length) {
    h += `<div class="card empty"><p>Noch keine Ausgaben in diesem Monat.</p></div>`;
  } else {
    h += m.expenseGroups.map(g => {
      const share = m.expenseTotal > 0 ? g.totalCents / m.expenseTotal : 0;
      return `<div class="card" style="margin-top:12px">
        <div class="cathead">
          <div class="t">
            <b>${esc(catLabel(g.category))}</b>
            <span>${g.entries.length} ${g.entries.length === 1 ? "Posten" : "Posten"} · ${percentOf(g.totalCents, m.expenseTotal)} % der Ausgaben</span>
          </div>
          <div class="a num">${fmt(g.totalCents)}</div>
        </div>
        <div class="catbar"><i style="width:${(share * 100).toFixed(1)}%;background:var(--out)"></i></div>
        <div class="rows">${g.entries.map(entryRowHTML).join("")}</div>
      </div>`;
    }).join("");
  }

  h += `<p class="hint">Tippe auf einen Posten, um ihn zu ändern oder zu löschen.</p>`;
  view.innerHTML = h;
}

function entryRowHTML(e) {
  return `<button class="row" type="button" data-entry="${e.id}">
    <span class="t">

}

      <button type="button" data-pot-filter="${pot.id}" aria-pressed="${state.potFilter === pot.id}">
        <i class="dot" style="background:${potColor(pot)}"></i>${esc(pot.name)}
      </button>`).join("")}
    <button type="button" class="add" data-pot-new aria-label="Neuen Topf anlegen">+ Topf</button>
  </div>`;
}

/** Übersicht aller Töpfe mit Aufteilung, Stand und – falls gesetzt – Ziel. */
function potsCardHTML() {
  if (!state.pots.length) return "";
  const rows = state.pots.map(pot => ({ pot, balance: potBalance(pot.id) }));
  const positive = rows.filter(r => r.balance > 0).reduce((sum, r) => sum + r.balance, 0);
  const total = rows.reduce((sum, r) => sum + r.balance, 0);

  return `<div class="card" style="margin-top:12px">
    <div class="cathead">
      <div class="t">
        <b>Aufteilung</b>
        <span>${rows.length} ${rows.length === 1 ? "Topf" : "Töpfe"} · gesamt <span class="num">${fmt(total)}</span></span>
      </div>
    </div>
    ${positive > 0 ? `<div class="stack-bar" role="img" aria-label="Aufteilung des Ersparten auf die Töpfe">
      ${rows.filter(r => r.balance > 0).map(r =>
        `<i style="flex:${r.balance};background:${potColor(r.pot)}" title="${esc(r.pot.name)}"></i>`).join("")}
    </div>` : ""}
    <div class="rows">
      ${rows.map(({ pot, balance }) => {
        const share = positive > 0 && balance > 0 ? Math.round(balance / positive * 100) : 0;
        const reached = pot.targetCents ? Math.max(0, Math.min(100, Math.round(balance / pot.targetCents * 100))) : null;
        return `<button class="row" type="button" data-pot-edit="${pot.id}">
          <span class="dot" style="background:${potColor(pot)}"></span>
          <span class="t">
            <b>${esc(pot.name)}</b>
            ${pot.targetCents
              ? `<span class="meta">Ziel <span class="num">${fmt(pot.targetCents)}</span> · ${reached} % erreicht</span>
                 <span class="potbar"><i style="width:${reached}%;background:${potColor(pot)}"></i></span>`
              : `<span class="meta">${share} % des Ersparten</span>`}
          </span>
          <span class="a num" style="${balance < 0 ? "color:var(--critical)" : ""}">${fmt(balance)}</span>
        </button>`;
      }).join("")}
    </div>
  </div>`;
}
